name: Run trading bot

# The hourly paper run happens on the Mac (scripts/exchange-run.sh paper, set
# up by scripts/setup-mac.sh): GitHub's scheduler skipped most hourly runs on
# this repo, and two schedulers writing state/*.json would collide. This
# workflow stays as a manual "Run workflow" button.
on:
  workflow_dispatch: {}

# Needed so the job can commit the updated state/*.json files back to the repo.
permissions:
  contents: write

concurrency:
  group: trading-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run bot
        run: node src/run.js

      - name: Commit updated state
        run: |
          git config user.name "tradebot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && echo "no state changes" && exit 0
          git commit -m "Bot run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
