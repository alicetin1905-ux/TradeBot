name: Bot-down alarm

# Checks every 30 minutes whether the Mac's hourly bot run is still
# happening and pushes an ntfy alert if it isn't (scripts/watchdog.js).
# GitHub may start scheduled runs late; the alarm tolerates that.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check last bot run
        run: node scripts/watchdog.js

      - name: Remember alert state
        run: |
          git config user.name "tradebot-watchdog"
          git config user.email "actions@users.noreply.github.com"
          git add state/watchdog.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Watchdog state"
          git pull --rebase -q && git push
